<script data-page-node-id="ZyBXYXsL17SneNvqB5s1ar" data-pnid-children="xBluQG3m8GNH81eWOnbnTN">
/* ================= 数据定义 ================= */
const STATE_EMOJI = { '固态': '❄️', '液态': '💧', '气态': '💨' };

const CHANGES = {
  '熔化': { from: '固态', to: '液态', energy: '加热', heat: '吸热▲' },
  '凝固': { from: '液态', to: '固态', energy: '冷却', heat: '放热▼' },
  '汽化': { from: '液态', to: '气态', energy: '加热', heat: '吸热▲' },
  '液化': { from: '气态', to: '液态', energy: '冷却', heat: '放热▼' },
  '升华': { from: '固态', to: '气态', energy: '加热', heat: '吸热▲' },
  '凝华': { from: '气态', to: '固态', energy: '冷却', heat: '放热▼' },
};

const INTERFERENCES = {
  '保温杯': { desc: '对手下次出变化牌需多付 1 张能量牌' },
  '风口':   { desc: '对手下回合只能出「汽化」' },
  '热浪':   { desc: '弃掉对手 1 张冷却牌' },
  '寒流':   { desc: '弃掉对手 1 张加热牌' },
};

const CHANGE_COUNT = { '熔化': 3, '凝固': 3, '汽化': 3, '液化': 3, '升华': 2, '凝华': 2 };

let deck = [], discard = [], players, current, gameId = 0, busy = false;
let cardUid = 0;

/* ================= 牌组 ================= */
function buildDeck() {
  const cards = [];
  const add = (name, type) => cards.push({ id: ++cardUid, name, type });
  for (let i = 0; i < 10; i++) add('加热', 'energy');
  for (let i = 0; i < 10; i++) add('冷却', 'energy');
  for (const [name, n] of Object.entries(CHANGE_COUNT))
    for (let i = 0; i < n; i++) add(name, 'change');
  for (const name of Object.keys(INTERFERENCES)) add(name, 'interf');
  return shuffle(cards);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function draw(n) {
  const got = [];
  for (let i = 0; i < n; i++) {
    if (deck.length === 0) {
      if (discard.length === 0) break;
      deck = shuffle(discard.splice(0));
      log('牌堆已空，弃牌堆洗回，重新发牌！', 'info');
    }
    got.push(deck.pop());
  }
  return got;
}

/* ================= 开局 ================= */
function restart() {
  gameId++;
  deck = buildDeck(); discard = [];
  players = [
    { name: '玩家一', score: 0, state: '固态', hand: [], forced: null, extraCost: false, streak: 0 },
    { name: '玩家二', score: 0, state: '固态', hand: [], forced: null, extraCost: false, streak: 0 },
  ];
  if (document.getElementById('modeSel').value === 'ai') players[1].name = '🤖 电脑';
  players.forEach(p => p.hand = draw(8));
  current = 0;
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('logbox').innerHTML = '';
  log('对局开始！双方物质均为固态，先到 10 分获胜。', 'gold');
  render();
  maybeAI();
}

/* ================= 出牌逻辑 ================= */
function findEnergy(hand, type, count = 1) {
  const ids = [];
  for (const c of hand) if (c.type === 'energy' && c.name === type) ids.push(c.id);
  return ids.length >= count ? ids.slice(0, count) : null;
}

function removeCards(player, ids) {
  const removed = player.hand.filter(c => ids.includes(c.id));
  player.hand = player.hand.filter(c => !ids.includes(c.id));
  discard.push(...removed);
}

function playChange(playerIdx, cardId) {
  if (busy) return;
  if (playerIdx !== current) { toast('还没轮到你出牌哦', ''); return; }
  const p = players[playerIdx], opp = players[1 - playerIdx];
  const card = p.hand.find(c => c.id === cardId);
  if (!card) return;

  // 风口强制
  if (p.forced === '风口' && card.name !== '汽化') {
    toast('被「风口」控制！', '本回合只能打出「汽化」，否则只能跳过');
    return;
  }

  const rule = CHANGES[card.name];
  if (!rule) return;

  // 合法性判定 1：起点状态
  if (p.state !== rule.from) {
    const hint = (p.state === '液态' && rule.to === '固态' && card.name === '凝华')
      ? '凝华是气态直接变固态，不经过液态！' : '';
    toast(`❌ ${card.name}需要从「${rule.from}」开始，你现在是「${p.state}」`, hint || `想一想：${p.state}要完成${card.name}，中间该先变成什么？`);
    return;
  }

  // 合法性判定 2：能量牌
  const need = p.extraCost ? 2 : 1;
  const energyIds = findEnergy(p.hand, rule.energy, need);
  if (!energyIds) {
    toast(`缺少 ${need} 张「${rule.energy}」牌`, p.extraCost ? '保温杯生效：这次要多付 1 张能量牌！' : '能量牌（加热/冷却）是出变化牌的燃料');
    return;
  }

  // 成功执行
  removeCards(p, [cardId, ...energyIds]);
  p.state = rule.to;
  p.extraCost = false;
  if (p.forced === '风口') p.forced = null;
  p.score += 2;
  p.streak++;
  let bonusMsg = '';
  if (p.streak >= 3) { p.score += 3; p.streak = 0; bonusMsg = ' —— 🔥 三连击达成，额外 +3 分！'; }
  log(`${p.name} 打出「${card.name}」（${rule.from}→${rule.to}，${rule.heat}）+2 分${bonusMsg}`, 'good');
  popState(playerIdx);
  render();
  checkWin();
  if (document.getElementById('winOverlay').classList.contains('show')) return;
  endTurn();
}

function playInterference(playerIdx, cardId) {
  if (busy) return;
  if (playerIdx !== current) { toast('还没轮到你出牌哦', ''); return; }
  const p = players[playerIdx], opp = players[1 - playerIdx];
  const card = p.hand.find(c => c.id === cardId);
  if (!card || card.type !== 'interf') return;

  if (p.forced === '风口') { toast('被「风口」控制！', '本回合只能打出「汽化」'); return; }

  removeCards(p, [cardId]);
  if (card.name === '保温杯') {
    opp.extraCost = true;
    log(`${p.name} 对 ${opp.name} 使用「保温杯」：下次出变化牌要多付 1 张能量牌！`, 'info');
  } else if (card.name === '风口') {
    opp.forced = '风口';
    log(`${p.name} 对 ${opp.name} 使用「风口」：下回合只能出「汽化」！`, 'info');
  } else if (card.name === '热浪') {
    const target = opp.hand.filter(c => c.type === 'energy' && c.name === '冷却');
    if (target.length) {
      const victim = target[Math.floor(Math.random() * target.length)];
      removeCards(opp, [victim.id]);
      log(`${p.name} 的「热浪」烧掉了 ${opp.name} 的 1 张「冷却」牌！`, 'info');
    } else log(`${p.name} 的「热浪」落空了——${opp.name} 手里没有冷却牌。`, 'info');
  } else if (card.name === '寒流') {
    const target = opp.hand.filter(c => c.type === 'energy' && c.name === '加热');
    if (target.length) {
      const victim = target[Math.floor(Math.random() * target.length)];
      removeCards(opp, [victim.id]);
      log(`${p.name} 的「寒流」冻掉了 ${opp.name} 的 1 张「加热」牌！`, 'info');
    } else log(`${p.name} 的「寒流」落空了——${opp.name} 手里没有加热牌。`, 'info');
  }
  render();
  endTurn();
}

function passTurn() {
  if (busy) return;
  const p = players[current];
  if (p.forced === '风口') {
    log(`${p.name} 无法完成「汽化」，被风口吹过了回合。`, 'bad');
    p.forced = null;
  } else {
    log(`${p.name} 跳过回合。`, 'info');
  }
  p.streak = 0;
  const got = draw(1);
  p.hand.push(...got);
  render();
  endTurn();
}

function endTurn() {
  const p = players[current];
  const got = draw(2);
  p.hand.push(...got);
  current = 1 - current;
  render();
  maybeAI();
}

/* ================= 电脑 AI ================= */
function maybeAI() {
  if (document.getElementById('modeSel').value !== 'ai' || current !== 1) return;
  busy = true;
  setTimeout(() => {
    busy = false;
    aiMove();
  }, 900);
}

function aiMove() {
  const p = players[1], opp = players[0];
  // 风口强制
  if (p.forced === '风口') {
    const card = p.hand.find(c => c.name === '汽化');
    const rule = CHANGES['汽化'];
    if (card && p.state === rule.from) {
      const need = p.extraCost ? 2 : 1;
      const eids = findEnergy(p.hand, rule.energy, need);
      if (eids) { playChangeAI(card.id, eids, rule, card.name); return; }
    }
    p.forced = null; p.streak = 0;
    log('🤖 无法完成「汽化」，被风口吹过了回合。', 'bad');
    p.hand.push(...draw(1));
    render(); endTurn(); return;
  }
  // 找合法变化
  for (const card of p.hand) {
    const rule = CHANGES[card.name];
    if (!rule || p.state !== rule.from) continue;
    const need = p.extraCost ? 2 : 1;
    const eids = findEnergy(p.hand, rule.energy, need);
    if (eids) { playChangeAI(card.id, eids, rule, card.name); return; }
  }
  // 出干扰牌
  const interf = p.hand.find(c => c.type === 'interf');
  if (interf && (opp.streak >= 1 || Math.random() < .5)) { playInterference(1, interf.id); return; }
  // 跳过
  log('🤖 跳过回合。', 'info');
  p.streak = 0;
  p.hand.push(...draw(1));
  render(); endTurn();
}

function playChangeAI(cardId, energyIds, rule, name) {
  const p = players[1];
  removeCards(p, [cardId, ...energyIds]);
  p.state = rule.to;
  p.extraCost = false;
  p.score += 2; p.streak++;
  let bonusMsg = '';
  if (p.streak >= 3) { p.score += 3; p.streak = 0; bonusMsg = ' —— 🔥 三连击达成，额外 +3 分！'; }
  log(`🤖 打出「${name}」（${rule.from}→${rule.to}，${rule.heat}）+2 分${bonusMsg}`, 'good');
  popState(1);
  render();
  checkWin();
  if (document.getElementById('winOverlay').classList.contains('show')) return;
  endTurn();
}

/* ================= 渲染 ================= */
function cardHTML(c) {
  let tag = '', desc = '', cls = c.type;
  if (c.type === 'energy') {
    cls = c.name === '加热' ? 'heat' : 'cool';
    tag = `<span class="ctag">能量 · ${c.name === '加热' ? '吸热▲' : '放热▼'}</span>`;
    desc = '出变化牌的燃料';
  } else if (c.type === 'change') {
    const r = CHANGES[c.name];
    tag = `<span class="ctag">${r.heat}</span>`;
    desc = `${r.from} → ${r.to}<br>需配「${r.energy}」牌`;
  } else {
    tag = `<span class="ctag">干扰</span>`;
    desc = INTERFERENCES[c.name].desc;
  }
  return `<div class="card ${cls}" onclick="onCard(${c.id})">
    <div class="cname">${c.name}</div>${tag}<div class="cdesc">${desc}</div></div>`;
}

function render() {
  const modeAI = document.getElementById('modeSel').value === 'ai';
  players.forEach((p, i) => {
    document.getElementById('name' + i).textContent = p.name;
    document.getElementById('score' + i).textContent = p.score + ' 分';
    document.getElementById('icon' + i).textContent = STATE_EMOJI[p.state];
    document.getElementById('label' + i).textContent = p.state;
    document.getElementById('streak' + i).textContent = p.streak > 0 ? `🔥 连击 x${p.streak}` : '';
    document.getElementById('hand' + i).innerHTML = p.hand.map(cardHTML).join('') ||
      '<div style="color:#8899bb;font-size:13px;align-self:center;">（手牌已空）</div>';
    let b = '';
    if (p.extraCost) b += '<span class="badge">🥤 保温杯：下次多付 1 能量</span>';
    if (p.forced === '风口') b += '<span class="badge wind">🍃 风口：只能出「汽化」</span>';
    document.getElementById('badges' + i).innerHTML = b;
    const panel = document.getElementById('panel' + i);
    panel.classList.toggle('active', i === current);
    panel.classList.toggle('done', modeAI && i === 1);
  });
  document.getElementById('deckCnt').textContent = deck.length;
  document.getElementById('turnHint').textContent = `轮到 ${players[current].name} 出牌`;
  document.getElementById('passBtn').disabled = (modeAI && current === 1);
  document.getElementById('passBtn').style.opacity = (modeAI && current === 1) ? .4 : 1;
}

function onCard(cardId) {
  if (busy) return;
  for (let i = 0; i < 2; i++) {
    const card = players[i].hand.find(c => c.id === cardId);
    if (!card) continue;
    if (card.type === 'change') playChange(i, cardId);
    else if (card.type === 'interf') playInterference(i, cardId);
    else toast('能量牌会自动消耗', '点击一张变化牌即可，系统自动配对所需能量');
    return;
  }
}

/* ================= 辅助 ================= */
function log(msg, cls = 'info') {
  const box = document.getElementById('logbox');
  const div = document.createElement('div');
  div.className = 'log-' + cls;
  div.textContent = msg;
  box.prepend(div);
}

let toastTimer;
function toast(msg, tip) {
  const t = document.getElementById('toast');
  t.innerHTML = msg + (tip ? `<span class="tip">💡 ${tip}</span>` : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function popState(i) {
  const el = document.getElementById('icon' + i);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function checkWin() {
  const w = players.find(p => p.score >= 10);
  if (w) {
    document.getElementById('winTitle').textContent = `🎉 ${w.name} 获胜！`;
    document.getElementById('winDetail').textContent =
      `最终比分 ${players[0].score} : ${players[1].score} —— 三态变化，尽在掌控！`;
    document.getElementById('winOverlay').classList.add('show');
  }
}

restart();
</script>
